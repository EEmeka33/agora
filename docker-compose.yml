# Run Agora locally with Docker:
#   docker compose up -d --build
# then open http://localhost:3000 and follow the setup wizard.
services:
  agora:
    build: .
    image: agora:latest
    container_name: agora
    ports:
      - "3000:3000"
    environment:
      # Time zone used for "today", greetings and relative dates.
      TZ: Europe/Paris
      # Who can create an account: open | invite | closed
      SIGNUP_MODE: "open"
      ALLOW_NEW_ASSOCIATIONS: "true"
      # Public address used in emails and links, e.g. https://agora.my-association.org
      # APP_URL: ""
      # Optional email notifications / password reset:
      # SMTP_URL: "smtps://user:password@smtp.example.org:465"
      # MAIL_FROM: "Agora <no-reply@my-association.org>"
      # Set to "true" if you serve Agora over HTTPS (reverse proxy).
      SECURE_COOKIES: "false"
      MAX_UPLOAD_MB: "20"
    volumes:
      - agora-data:/app/data
    restart: unless-stopped

volumes:
  agora-data:
